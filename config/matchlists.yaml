# Named keyword groups. Matching is a case-insensitive substring match.
match_lists:
  virtualization:
    - vmware
    - esxi
    - vcenter
  citrix_netscaler:
    - netscaler
    - citrix
  java_frameworks:
    - springboot
    - spring boot
    - quarkus
  database:
    - mysql
    - postgresql
    - mongodb
    - redis
    - mariadb
  devops_tools:
    - jenkins
    - gitlab
  browser:
    - chrome
    - firefox
    - safari
    - edge
  operating_systems:
    - windows
    - linux
    - macos
    - redhat
    - alma
    - centos
    - ubuntu
  infrastructure:
    - kubernetes
    - docker
    - podman
