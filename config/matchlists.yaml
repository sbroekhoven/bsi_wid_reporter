# Named keyword groups. Matching is a case-insensitive substring match.
match_lists:
  virtualization:
    - vmware
    - esxi
    - vcenter
  citrix_netscaler:
    - netscaler
    - citrix
  java_frameworks:
    - springboot
    - spring boot
    - quarkus
  database:
    - mysql
    - postgresql
    - mongodb
    - redis
    - mariadb
  devops_tools:
    - jenkins
    - gitlab

